# Example policy. Every list and token here is made up; see README.
name = "example-desk"
version = "2026-12-01-strict"

[tokens]
unlisted = "reject"
require_permitted_from = "2028-07-18"   # GENIUS Act sec. 3(b)(1)
not_permitted_after = "reject"
not_permitted_before = "review"

[[tokens.allow]]
chain = "eth"
contract = "0xa1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1"
symbol = "USDX"
issuer = "Example Permitted Issuer"
status = "permitted"

[[tokens.allow]]
chain = "eth"
contract = "0xb2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2"
symbol = "USDQ"
issuer = "Example Unlicensed Issuer"
status = "not-permitted"

[[lists]]
path = "lists/sanctions-example.json"
action = "block"
max_age_days = 30

[[lists]]
path = "lists/attribution-example.csv"
name = "Example attributions (synthetic)"
source = "made up for this repository"
as_of = "2026-11-30"
max_age_days = 30

[categories]
mixer = "reject"

[exposure]
max_hops = 3
min_share_pct = 1

[special_measures]
enabled = true

[travel_rule]
threshold_cents = 300000
missing = "hold"
