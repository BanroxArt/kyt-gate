[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kytgate"
version = "0.1.0"
description = "Policy-as-code gate for stablecoin and token transfers: issuer allowlist, sanctioned and flagged addresses from lists you supply, FinCEN special measures, Travel Rule data, with a simulator that replays transfers under two policies. Engineering checklist, not legal advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = ["specialmeasures @ git+https://github.com/BanroxArt/special-measures@f0555e706e9c290352072dbf4fee1dbd015e2a2c"]
keywords = ["kyt", "stablecoin", "ofac", "sanctions-screening", "travel-rule", "genius-act", "aml", "compliance", "crypto"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/kyt-gate"

[project.scripts]
kytgate = "kytgate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kytgate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
